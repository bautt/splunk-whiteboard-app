# Maintainer: tbaublys@splunk.com

[ui]
is_visible = 1
show_in_nav = true
label = Whiteboard App

[launcher]
author = Tomas Baublys
description = Collaborative Excalidraw whiteboard inside Splunk for platform architecture and workshop diagrams. Documentation: https://github.com/bautt/splunk-whiteboard-app/blob/main/README.md
version = 0.3.75

[package]
check_for_updates = true
id = whiteboard_app

[id]
name = whiteboard_app
version = 0.3.75

# No state_change_requires_restart: enabling or disabling the app needs no
# splunkd restart. Nor a [triggers] stanza — that is only for an app's own
# custom conf files, and everything shipped here (collections.conf,
# transforms.conf, views, nav) is Splunk-defined and reloads on its own.
[install]
allows_disable = true
build = 73
