# The whiteboards KV Store collection is owned by the main whiteboard_app and
# exported system-wide. We (re)declare the lookup transform here so this app is
# self-contained and can feed a Dashboard Studio kvstore-lookup dataSource:
#
#     | inputlookup whiteboards where _key="<board id>"
#
# which yields a row whose elements_json field carries the serialized board.
[whiteboards]
external_type = kvstore
collection = whiteboards
fields_list = _key, name, tags, owner, visibility, updated_at, elements_json
