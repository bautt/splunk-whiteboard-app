[package]
id = whiteboard_viz
# Experimental app, never published to Splunkbase, so updates stay off.
check_for_updates = 0

[id]
version = 0.1.0
name = whiteboard_viz

[ui]
is_visible = 0
label = Whiteboard
show_in_nav = 0

[launcher]
author = Tomas Baublys
description = Renders Whiteboard App boards live inside Dashboard Studio (experimental, Splunk 10.4+)
version = 0.1.0

[install]
is_configured = 0
build = <@- buildNumber @>

[manifest]
# Authoring metadata only. The packager folds this into app.manifest and strips
# the stanza, because app.conf has no [manifest] stanza and splunkd would warn.
category = Custom
